name: Auto-deploy to staging (admin panel)
on: {push: {branches: [thailand-kitchen-admin-frontend-staging]}}
jobs: {deploy: {runs-on: ubuntu-latest, steps: [{name: "SSH into droplet and run staging deploy script", uses: "appleboy/ssh-action@v1.0.3", with: {host: "${{ secrets.SSH_HOST }}", username: "${{ secrets.SSH_USER }}", key: "${{ secrets.SSH_PRIVATE_KEY }}", script: "bash /var/www/deploy_scripts/staging_thailand_kitchen_admin.sh"}}]}}
